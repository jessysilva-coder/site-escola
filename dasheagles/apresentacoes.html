<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apresentações dos mentorados</title><style>body{font:15px/1.6 Arial;background:#f0f0f0;color:#020617;margin:32px}main{max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}article{background:white;padding:16px;border-radius:16px;min-width:0}iframe{display:block;width:100%;height:auto;aspect-ratio:16/9;border:0;border-radius:10px;background:#000}button{padding:12px;border:0;background:#ff7000;border-radius:8px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style><main><h1>Apresentações dos mentorados</h1><p>Mentorados ativos, em ordem alfabética. Use a conta Google da equipe para assistir.</p><button id="atualizar">Atualizar</button> <a href="acompanhamento.html">Voltar ao acompanhamento</a><p id="status" role="status"></p><div id="galeria" class="grid"></div></main><script>
async function carregar(){const status=document.getElementById('status'),token=sessionStorage.getItem('dh_admin_token');if(!token){status.textContent='Entre no acompanhamento e abra esta página pelo menu Outros.';return;}status.textContent='Carregando…';try{const res=await fetch('https://script.google.com/macros/s/AKfycbyPEnqp0v2d8f6njitEMR6O9gH7AxghHxmBmKGayEowh---7-b7-Z6I2zrg8LTk55BI2Q/exec',{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'listarVideosApresentacao',token})}),d=await res.json();if(d.erro)throw Error(d.erro);const box=document.getElementById('galeria');box.replaceChildren();for(const m of d.colegas){const card=document.createElement('article'),name=document.createElement('h2'),frame=document.createElement('iframe'),link=document.createElement('a');name.textContent=m.nome;frame.title='Apresentação de '+m.nome;frame.loading='lazy';frame.allow='fullscreen';frame.src='https://drive.google.com/file/d/'+encodeURIComponent(m.video_id)+'/preview';link.href='https://drive.google.com/file/d/'+encodeURIComponent(m.video_id)+'/view';link.target='_blank';link.rel='noopener';link.textContent='Abrir no Drive';card.append(name,frame,link);box.append(card);}status.textContent=d.colegas.length?'':'Nenhuma apresentação cadastrada.';}catch(e){status.textContent=e.message;}}
document.getElementById('atualizar').onclick=carregar;carregar();</script></html>
